name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (format, lint, typecheck, knip)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' ||
      vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslintcache-${{ hashFiles('bun.lock',
            'eslint.config.mjs', 'lint-policy.mjs', 'eslint-rules/**') }}
          restore-keys: ${{ runner.os }}-eslintcache-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-quality-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-quality-

      - name: Check workspaces
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run check ${{ github.event_name == 'pull_request' &&
          '--affected' || '' }}

      - name: Check root
        run: bunx turbo run check:root

  test:
    name: Test (Vitest browser mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{ print $2 }')" >>
          "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{
            steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-test-

      - name: Run workspace tests with coverage
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run test:coverage ${{ github.event_name == 'pull_request'
          && '--affected' || '' }}

      - name: Run library browser tests on Firefox and WebKit
        run: bun run --cwd packages/animated-fluent-emojis test:cross-browser

      - name: Run root tests with coverage
        run: bunx turbo run test:coverage:root

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-report
          path: |
            coverage/
            packages/animated-fluent-emojis/coverage/
            .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package (build, publint, attw, size)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-package-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-package-

      - name: Build, lint package and check size limit
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run build lint:package size --filter=animated-fluent-emojis
          ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Report package size
        run: |
          if [[ ! -d packages/animated-fluent-emojis/dist ]]; then
            echo "Package not affected by this change, nothing to report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tarball_dir=$(mktemp -d)
          (cd packages/animated-fluent-emojis && bun pm pack --ignore-scripts --destination "$tarball_dir" --quiet)
          tarball=$(ls "$tarball_dir"/*.tgz)
          tarball_size=$(du -h "$tarball" | cut -f1)
          dist_size=$(du -sh packages/animated-fluent-emojis/dist | cut -f1)
          {
            echo "**Package tarball size:** \`${tarball_size}\` (\`$(basename "$tarball")\`)"
            echo ""
            echo "**dist size:** \`${dist_size}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    name: Commitlint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' ||
      vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'develop' && !github.event.pull_request.head.repo.fork)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci-passed:
    name: CI passed
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' ||
      vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    needs: [quality, test, package, commitlint]
    if: always()
    steps:
      - name: Check job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
        run: |
          failed=0
          report_unless() {
            local job="$1" result="$2"
            shift 2
            for accepted in "$@"; do
              [[ "${result}" == "${accepted}" ]] && return 0
            done
            echo "The ${job} job ended with ${result}."
            failed=1
          }
          report_unless quality "${QUALITY_RESULT}" success
          report_unless test "${TEST_RESULT}" success
          report_unless package "${PACKAGE_RESULT}" success
          report_unless commitlint "${COMMITLINT_RESULT}" success skipped
          if [[ "${failed}" == "1" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi

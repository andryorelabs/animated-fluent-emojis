name: Lint Docs

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check markdown links
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' ||
      vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --offline blocks all network requests so third-party outages cannot
      # flake CI; --include-fragments=anchor-only also validates `#heading`
      # anchors, not just that the target file exists.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments=anchor-only --no-progress '*.md'
            'docs/**/*.md' '.github/**/*.md'
          fail: true
